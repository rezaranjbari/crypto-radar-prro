name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e

          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d project

          echo "=== Project files ==="
          find project -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          set -e

          echo "=== Searching for Gradle project ==="

          GRADLE_FILE=$(find project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found."
            echo "The ZIP does not contain an Android Gradle project."
            echo "=== ZIP contents ==="
            find project -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "Gradle wrapper found:"
          echo "$GRADLE_FILE"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/CryptoRadarPro.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoRadarPro
          path: CryptoRadarPro.apk
