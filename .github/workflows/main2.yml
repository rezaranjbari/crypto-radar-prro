name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project
        run: |
          set -e

          echo "=== Searching for Android project ==="

          PROJECT_DIR=""

          if [ -f "gradlew" ]; then
            PROJECT_DIR="."
          elif [ -f "project/crp/settings.gradle.kts" ]; then
            PROJECT_DIR="project/crp"
          else
            PROJECT_DIR=$(find . -name "settings.gradle.kts" -type f -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== Generating Gradle Wrapper ==="

          gradle wrapper

          chmod +x gradlew

          echo "=== Gradle Wrapper created ==="
          ls -la
          ls -la gradlew

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=== Building APK ==="

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          set -e

          echo "=== Searching for APK ==="

          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Radar-Pro-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
