name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "=== Repository ==="
          find . -maxdepth 3 -type f | sort

      - name: Extract Android project
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 5 -type f | sort

      - name: Find Android project
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "=== Extracted ZIP contents ==="
            find extracted -maxdepth 8 -type f | sort
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Gradle project
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Project files ==="
          find . -maxdepth 3 -type f | sort

          echo "=== Checking Gradle wrapper ==="

          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found. Generating Gradle wrapper..."

            if ! command -v gradle >/dev/null 2>&1; then
              echo "Installing Gradle..."
              sudo apt-get update
              sudo apt-get install -y gradle
            fi

            gradle wrapper
          fi

          chmod +x ./gradlew

      - name: Build APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Building APK ==="

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          set -e

          echo "=== APK files ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crypto-radar-pro-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
