name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          echo "=== Finding project ZIP ==="

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "=== ZIP contents ==="
          find extracted -maxdepth 4 -type f | sort | head -200

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "=== Searching for Android project ==="

          GRADLE_FILE=$(find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "*/build/*" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          while [ "$PROJECT_DIR" != "." ] && [ "$PROJECT_DIR" != "/" ]; do
            if [ -f "$PROJECT_DIR/settings.gradle" ] || [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
              break
            fi
            PROJECT_DIR=$(dirname "$PROJECT_DIR")
          done

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Project files ==="
          ls -la

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."

            if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
              echo "Gradle wrapper properties found, generating wrapper..."

              gradle wrapper

            else
              echo "ERROR: Gradle wrapper is missing."
              exit 1
            fi
          fi

          chmod +x gradlew

      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Creating debug keystore ==="

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug keystore created:"
          ls -lh debug.keystore

      - name: Check Google Services
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Checking google-services.json ==="

          if [ -f "app/google-services.json" ]; then
            echo "google-services.json found."
          else
            echo "WARNING: google-services.json is missing."
            echo "Continuing because the build may not require Firebase at runtime."
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Building APK ==="

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=== Searching for APK ==="

          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Radar-Pro-debug
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
