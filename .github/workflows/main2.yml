name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP file
        run: |
          echo "=== Files in repository ==="
          find . -maxdepth 2 -type f | sort

      - name: Extract project ZIP
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          echo "=== Extracted files ==="
          find project -maxdepth 3 -type f | sort | head -200

      - name: Find Gradle project
        run: |
          set -e

          echo "=== Searching for Gradle project ==="

          GRADLE_FILE=$(find project -type f \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle project was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          while [ "$PROJECT_DIR" != "." ] && [ "$PROJECT_DIR" != "/" ]; do
            if [ -f "$PROJECT_DIR/gradlew" ]; then
              break
            fi
            PROJECT_DIR=$(dirname "$PROJECT_DIR")
          done

          echo "Gradle project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Starting Gradle build ==="

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          set -e

          echo "=== Searching for APK ==="

          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Radar-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
