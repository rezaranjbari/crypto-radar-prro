name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q *.zip -d project

          echo "=== Project structure ==="
          find project -maxdepth 4 -type f | head -200

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."

          GRADLE_FILE=$(find project -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No Android/Gradle project found."
            echo "Checking for build.gradle files:"
            find project -name "build.gradle" -o -name "build.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew not found. Installing Gradle..."
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle assembleDebug
          fi

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find project -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Radar-Pro-APK
          path: "project/**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
