name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q *.zip -d project
          echo "Project files:"
          find project -maxdepth 3 -type f | head -200

      - name: Find Android project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo "The project structure is shown above."
            exit 1
          fi

          chmod +x "$GRADLEW"
          echo "Found: $GRADLEW"

          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Radar-Pro-APK
          path: "**/build/outputs/apk/**/*.apk"
